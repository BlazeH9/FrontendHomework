<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }

        .cube{
            width: 170px;
            height: 170px;

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;

            --shadow-color: rgba(0, 0, 0, .45);
            box-shadow: 0 12px 24px var(--shadow-color);
            transition: transform .35s ease, box-shadow .35s ease;
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px var(--shadow-color);
        }

        .c1{
            border-radius: 0;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            --shadow-color: rgba(255, 94, 98, .50)
        }
        .c2{
            border-radius: 18px;
            background: linear-gradient(135deg, #3ddc97, #10c9a0);
            --shadow-color: rgba(16, 201, 160, .45)
        }
        .c3{
            border-radius: 42px;
            background: linear-gradient(135deg, #b39ddb, #8e6fb0);
            --shadow-color: rgba(142, 111, 176, .50)
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg, #ffe08a, #ffb347);
            --shadow-color: rgba(255, 179, 71, .50)
        }
        .c5{
            border-radius: 16px;
            background: linear-gradient(135deg, #5aa79b, #2e6b5e);
            --shadow-color: rgba(46, 107, 94, .60)
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg, #b9a3d4, #8f7bb3);
            --shadow-color: rgba(143, 123, 179, .50)
        }
        
        .hover-text {
            font: 600 22px/1 "Microsoft YaHei";
            color: white;
            opacity: 0;
            transition: .3s ease .05s;
        }
        .cube:hover .hover-text {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"><span class="hover-text">hover</span></div>
        <div class="cube c2"><span class="hover-text">hover</span></div>
        <div class="cube c3"><span class="hover-text">hover</span></div>
        <div class="cube c4"><span class="hover-text">hover</span></div>
        <div class="cube c5"><span class="hover-text">hover</span></div>
        <div class="cube c6"><span class="hover-text">hover</span></div>
    </div>
</body>
</html>
